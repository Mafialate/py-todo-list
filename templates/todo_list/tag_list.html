{% extends "base.html" %}
{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Tags</h1>
    <a class="btn btn-primary" href="{% url 'todo_list:tag-create' %}">Add Tag</a>
  </div>
  <table>
    <tr>
      <th>Name</th>
      <th>Update</th>
      <th>Delete</th>
    </tr>
    {% for tag in tag_list %}
      <tr>
        <td>
          {{ tag.name }}
        </td>
        <td>
          <a class="btn btn-secondary" href="{% url 'todo_list:tag-update' pk=tag.id %}">Update</a>
        </td>
        <td>
          <a class="btn btn-secondary" href="{% url 'todo_list:tag-delete' pk=tag.id %}">Delete</a>
        </td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
